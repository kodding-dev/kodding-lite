[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kodding-lite"
version = "0.1.0"
description = "LangGraph 기반 블로그 글 생성 파이프라인 (기획 → 초안 → 발행)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3.49",
    "langchain-google-genai>=2.1",
    "langchain-anthropic>=0.3.10",
    "pydantic>=2.7",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["kodding_lite", "kodding_lite.nodes"]

[tool.setuptools.package-data]
kodding_lite = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
